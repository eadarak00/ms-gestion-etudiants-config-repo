server:
  port: 7072

spring:
  application:
    name: ms-scolarite

  datasource:
    url: jdbc:mariadb://localhost:3306/scolarite_db?createDatabaseIfNotExist=true
    username: scolarite
    password: scolarite
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MariaDBDialect

resilience4j:
  circuitbreaker:
    instances:
      authService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  retry:
    instances:
      authService:
        maxAttempts: 3
        waitDuration: 2s

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 3000
