server:
  port: 7070

spring:
  application:
    name: gateway-server

  main:
    web-application-type: reactive   # obligatoire pour Spring Cloud Gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/gestion-etudiants

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false   # désactivé car on utilise des routes manuelles

      routes:
        - id: auth-service
          uri: lb://auth-service   # minuscule obligatoire
          predicates:
            - Path=/api/auth/**
        - id: etudiant-service
          uri: lb://etudiant-service
          predicates:
            - Path=/api/etudiants/**,/api/inscriptions/**
        - id: scolarite-service
          uri: lb://scolarite-service
          predicates:
            - Path=/api/matieres/**,/api/classes/**
        - id: enseignant-service
          uri: lb://enseignant-service
          predicates:
            - Path=/api/enseignants/**,/api/affectations/**
        - id: notes-service
          uri: lb://notes-service
          predicates:
            - Path=/api/notes/**,/api/evaluations/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
