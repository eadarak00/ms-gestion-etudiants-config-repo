server:
  port: 7070

spring:
  application:
    name: gateway-server

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/gestion-etudiants

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: etudiant-service
          uri: lb://ETUDIANT-SERVICE
          predicates:
            - Path=/api/etudiants/**, /api/inscriptions/**
        - id: scolarite-service
          uri: lb://SCOLARITE-SERVICE
          predicates:
            - Path=/api/matieres/**, /api/classes/**
        - id: enseignant-service
          uri: lb://ENSEIGNANT-SERVICE
          predicates:
            - Path=/api/enseignants/**, /api/affectations/**
        - id: notes-service
          uri: lb://NOTES-SERVICE
          predicates:
            - Path=/api/notes/**, /api/evaluations/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
