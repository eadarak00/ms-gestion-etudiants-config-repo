server:
  port: 7070

spring:
  application:
    name: gateway-server

  main:
    web-application-type: reactive

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/gestion-etudiants

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: etudiant-service
          uri: lb://etudiant-service
          predicates:
            - Path=/api/etudiants/**,/api/inscriptions/**

        - id: scolarite-service
          uri: lb://scolarite-service
          predicates:
            - Path=/api/matieres/**,/api/classes/**,/api/classe-matieres/**

        - id: enseignant-service
          uri: lb://enseignant-service
          predicates:
            - Path=/api/enseignants/**,/api/affectations/**

        - id: notes-service
          uri: lb://notes-service
          predicates:
            - Path=/api/notes/**,/api/evaluations/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "*"
            allowed-methods: "*"
            allowed-headers: "*"

      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

management:
  endpoint:
    gateway:
      enabled: true
    health:
      show-details: always

  endpoints:
    web:
      exposure:
        include: health,info,gateway


logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route: DEBUG
