server:
  port: 7070

spring:
  application:
    name: gateway-server
    
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/gestion-etudiants


  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: etudiant-service
          uri: lb://ETUDIANT-SERVICE
          predicates:
            - Path=/api/students/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
