server:
  port: 7071

spring:
  application:
    name: ms-etudiant

  datasource:
    url: jdbc:mariadb://localhost:3306/etudiant_db?createDatabaseIfNotExist=true
    username: etudiant
    password: etudiant
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MariaDBDialect