server:
  port: 7074

spring:
  application:
    name: notes-service

  datasource:
    url: jdbc:mariadb://localhost:3306/note_db?createDatabaseIfNotExist=true
    username: note
    password: note
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MariaDBDialect


resilience4j:
  circuitbreaker:
    instances:
      etudiantService:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 10s
      scolariteService:
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        sliding-window-size: 10
        wait-duration-in-open-state: 10s

  retry:
    instances:
      authService:
        maxAttempts: 3
        waitDuration: 2s
      scolariteService:
        maxAttempts: 3
        waitDuration: 2s

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 3000
